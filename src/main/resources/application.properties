#Main application settings
spring.application.name=MedReminder-Server
spring.profiles.active=main
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#Server settings
server.servlet.context-path=/api/v1

#Database Setting
spring.datasource.tomcat.max-wait=10000

#JWT token refresh expire
jwt.refresh-expiry-days=3650

#Batch Jobs setting
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

#Batch Jobs Quartz settings
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=MedReminderScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.threadPool.threadCount=3